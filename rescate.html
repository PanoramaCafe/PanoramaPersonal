<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rescate — Panorama Personal</title><style>body{font-family:system-ui;margin:0;background:#f7f5ef;color:#202a27;padding:24px}main{max-width:720px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:20px;padding:22px}h1{margin-top:0}.warn{background:#fff4d6;border:1px solid #e8cf83;border-radius:14px;padding:14px}.card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:14px}button{width:100%;padding:16px;margin-top:10px;border:1px solid #ccc;border-radius:12px;background:#fff;font-size:16px;font-weight:800}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><h1>🛟 Rescate de Panorama Personal</h1><div class="warn"><b>Modo solo lectura.</b><br>Esta página no sincroniza, no modifica ni elimina datos de la aplicación.</div><div id="out" class="card">Leyendo copias locales…</div><button id="save">Guardar copia de rescate</button><button id="today">Guardar sesiones del 14 de septiembre</button></main><script>(function(){'use strict';const keys=['panorama_cafe_personal_v1','panorama_personal_pending_v5','panorama_personal_pending_v4'];const clone=x=>x==null?x:JSON.parse(JSON.stringify(x));const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};const copies=keys.map(k=>({key:k,data:read(k)})).filter(x=>x.data);const today='2026-09-14';function sessions(d){return Array.isArray(d?.sessions)?d.sessions:[]}function dateOf(s){return String(s?.date||s?.day||s?.startAt||s?.entryAt||s?.createdAt||'').slice(0,10)}function makeSafe(d){const x=clone(d)||{};delete x.adminPin;return x}function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}const rows=copies.map(c=>{const ss=sessions(c.data);const ts=ss.filter(s=>dateOf(s)===today);return '<b>'+c.key+'</b>: '+ss.length+' sesiones totales; <b>'+ts.length+' del 14/09/2026</b>'}).join('<br>');document.getElementById('out').innerHTML=rows||'<b>No se encontraron copias locales con esas claves.</b>';document.getElementById('save').onclick=()=>{const result={rescuedAt:new Date().toISOString(),copies:copies.map(c=>({source:c.key,data:makeSafe(c.data)}))};download('panorama-rescate-completo-2026-09-14.json',result)};document.getElementById('today').onclick=()=>{const result={rescuedAt:new Date().toISOString(),date:today,copies:copies.map(c=>({source:c.key,sessions:sessions(c.data).filter(s=>dateOf(s)===today)}))};download('panorama-sesiones-2026-09-14.json',result)};})();</script></body></html>
