name: Repair Panorama Personal sync
on:
  push:
    paths:
      - '.github/workflows/repair-sync.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sync engine
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > panorama-core-integration.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panorama-core-integration.js
          git commit -m 'Blindaje final de sincronización' || exit 0
          git push
